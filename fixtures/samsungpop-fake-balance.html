<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼성증권 POP - 잔고조회 (테스트용)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 24px; }
        .header { text-align: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #eee; }
        .header h1 { color: #1a1a1a; font-size: 24px; margin: 0; }
        .balance-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .balance-card { background: #f8f9fa; border-radius: 8px; padding: 20px; text-align: center; border: 1px solid #e9ecef; }
        .balance-label { font-size: 14px; color: #666; margin-bottom: 8px; font-weight: 500; }
        .balance-value { font-size: 28px; font-weight: 700; color: #1a1a1a; font-family: 'SF Mono', Monaco, monospace; }
        .account-section { background: #f8f9fa; border-radius: 8px; padding: 20px; border: 1px solid #e9ecef; }
        .account-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #e9ecef; }
        .account-row:last-child { border-bottom: none; }
        .account-label { font-size: 14px; color: #666; font-weight: 500; }
        .account-value { font-family: 'SF Mono', Monaco, monospace; font-size: 16px; color: #1a1a1a; }
        .test-notice { background: #fff3cd; border: 1px solid #ffc107; border-radius: 4px; padding: 12px; margin-top: 20px; color: #856404; font-size: 14px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>삼성증권 POP</h1>
            <p style="color: #666; margin: 8px 0 0;">잔고조회 - 테스트 전용 페이지</p>
        </div>

        <div class="balance-section">
            <div class="balance-card">
                <div class="balance-label">총 잔고 (TOTAL_BALANCE)</div>
                <div class="balance-value" data-testid="total-balance">12,345,678</div>
            </div>
            <div class="balance-card">
                <div class="balance-label">출금가능금액 (AVAILABLE_BALANCE)</div>
                <div class="balance-value" data-testid="available-balance">10,000,000</div>
            </div>
            <div class="balance-card">
                <div class="balance-label">평가금액 (EVALUATION_AMOUNT)</div>
                <div class="balance-value" data-testid="evaluation-amount">15,000,000</div>
            </div>
        </div>

        <div class="account-section">
            <div class="account-row">
                <span class="account-label">계좌번호 (ACCOUNT_NUMBER_MASKED)</span>
                <span class="account-value" data-testid="account-number">123-456-789012</span>
            </div>
            <div class="account-row">
                <span class="account-label">계좌명</span>
                <span class="account-value">종합매매계좌</span>
            </div>
        </div>

        <div class="test-notice">
            ⚠️ 이 페이지는 S2 개발/테스트용 가짜 금융 페이지입니다. 실제 금융 데이터가 아닙니다.
        </div>
    </div>
</body>
</html>
